<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eid Mubarak — Raiyan Tasrif</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf8f3;
  --gold: #c8a96e;
  --gold2: #e8d5a3;
  --gold3: #9d7c3f;
  --ink: #2a2218;
  --ink2: #5a4e38;
  --ink3: #8a7a60;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--cream); overflow-x: hidden; font-family: 'Cormorant Garamond', serif; color: var(--ink); }
body::before {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(200,169,110,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(200,169,110,0.08) 0%, transparent 50%);
}
.band { position: fixed; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), var(--gold2), var(--gold), transparent); z-index: 20; opacity: 0; animation: fadeIn 0.6s ease-out 0.2s forwards; }
.band.top { top: 0; }
.band.bot { bottom: 0; }
.corner { position: fixed; width: 90px; height: 90px; z-index: 10; pointer-events: none; opacity: 0; animation: fadeIn 1s ease-out 2.8s forwards; }
.corner.tl { top: 0; left: 0; }
.corner.tr { top: 0; right: 0; transform: scaleX(-1); }
.corner.bl { bottom: 0; left: 0; transform: scaleY(-1); }
.corner.br { bottom: 0; right: 0; transform: scale(-1); }
.corner svg { width: 100%; height: 100%; }
.stars-layer { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
.dot { position: absolute; border-radius: 50%; background: var(--gold); opacity: 0; animation: dotPulse var(--dp) ease-in-out infinite alternate; animation-delay: var(--dd); }
@keyframes dotPulse { 0% { opacity: 0.06; transform: scale(0.8); } 100% { opacity: 0.30; transform: scale(1.3); } }
.moon-scene { position: fixed; top: 0; left: 0; right: 0; z-index: 5; display: flex; justify-content: center; pointer-events: none; }
.page { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 160px 28px 100px; text-align: center; }
.arabic { font-family: 'Amiri', serif; font-size: clamp(28px, 9vw, 52px); color: var(--gold3); direction: rtl; letter-spacing: 2px; line-height: 1.5; opacity: 0; animation: riseUp 1.2s cubic-bezier(0.22,1,0.36,1) 1.4s forwards; margin-bottom: 4px; }
.rule { display: flex; align-items: center; gap: 10px; margin: 14px 0; opacity: 0; animation: fadeIn 1s ease-out 1.7s forwards; }
.rule-line { flex: 1; max-width: 100px; height: 0.5px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.rule-gem { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); }
.rule-gem-sm { width: 3px; height: 3px; background: var(--gold2); transform: rotate(45deg); }
.eid-word { font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(52px, 18vw, 110px); letter-spacing: -1px; line-height: 0.95; opacity: 0; animation: riseUp 1.4s cubic-bezier(0.22,1,0.36,1) 1.9s forwards; }
.eid-word span { display: inline-block; background: linear-gradient(170deg, var(--ink) 0%, var(--ink2) 40%, var(--gold3) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.mubarak-word { font-family: 'Cinzel', serif; font-weight: 400; font-size: clamp(22px, 7vw, 44px); letter-spacing: 10px; color: var(--gold3); opacity: 0; animation: riseUp 1.2s cubic-bezier(0.22,1,0.36,1) 2.1s forwards; margin-top: 4px; }
.sub-msg { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(15px, 4.5vw, 20px); color: var(--ink3); max-width: 340px; line-height: 1.8; opacity: 0; animation: fadeIn 1.2s ease-out 2.5s forwards; margin: 6px 0 0; }
.from-block { margin-top: 36px; opacity: 0; animation: riseUp 1s ease-out 2.8s forwards; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.from-label { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 4px; color: var(--ink3); text-transform: uppercase; }
.from-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: clamp(18px, 5.5vw, 26px); color: var(--ink); letter-spacing: 0.5px; }
.from-batch { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(14px, 4vw, 18px); color: var(--gold3); letter-spacing: 1px; }
.orn-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.orn-row span { color: var(--gold); font-size: 10px; }
.petal { position: fixed; pointer-events: none; z-index: 2; opacity: 0; animation: petalFall linear infinite; font-size: var(--ps); color: var(--gold); animation-duration: var(--pd); animation-delay: var(--pdd); }
@keyframes petalFall { 0% { transform: translateY(-30px) rotate(0deg) translateX(0); opacity: 0; } 8% { opacity: 0.5; } 85% { opacity: 0.3; } 100% { transform: translateY(105vh) rotate(540deg) translateX(var(--px)); opacity: 0; } }
@keyframes riseUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.share-btn { margin-top: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border: 1px solid var(--gold); background: transparent; color: var(--gold3); font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; opacity: 0; animation: fadeIn 1s ease-out 3.2s forwards; }
.share-btn:hover { background: var(--gold); color: var(--cream); }
.share-btn:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="band top"></div>
<div class="band bot"></div>
<div class="corner tl"><svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6 L6 42 M6 6 L42 6" stroke="#c8a96e" stroke-width="0.8"/><path d="M6 6 L28 28" stroke="#c8a96e" stroke-width="0.4" stroke-dasharray="2,3"/><circle cx="6" cy="6" r="2.5" fill="#c8a96e"/><circle cx="42" cy="6" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/><circle cx="6" cy="42" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/><path d="M18 6 L18 18 L6 18" stroke="#c8a96e" stroke-width="0.4" fill="none"/><circle cx="18" cy="18" r="1" fill="#c8a96e" opacity="0.6"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6 L6 42 M6 6 L42 6" stroke="#c8a96e" stroke-width="0.8"/><path d="M6 6 L28 28" stroke="#c8a96e" stroke-width="0.4" stroke-dasharray="2,3"/><circle cx="6" cy="6" r="2.5" fill="#c8a96e"/><circle cx="42" cy="6" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/><circle cx="6" cy="42" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/><path d="M18 6 L18 18 L6 18" stroke="#c8a96e" stroke-width="0.4" fill="none"/><circle cx="18" cy="18" r="1" fill="#c8a96e" opacity="0.6"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6 L6 42 M6 6 L42 6" stroke="#c8a96e" stroke-width="0.8"/><circle cx="6" cy="6" r="2.5" fill="#c8a96e"/><circle cx="42" cy="6" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/><circle cx="6" cy="42" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/></svg></div>
<div class="corner br"><svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6 L6 42 M6 6 L42 6" stroke="#c8a96e" stroke-width="0.8"/><circle cx="6" cy="6" r="2.5" fill="#c8a96e"/><circle cx="42" cy="6" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/><circle cx="6" cy="42" r="1.5" fill="none" stroke="#c8a96e" stroke-width="0.8"/></svg></div>
<div class="stars-layer" id="starsLayer"></div>
<div class="moon-scene"><canvas id="moonCanvas"></canvas></div>
<div id="petals"></div>
<div class="page">
  <div class="arabic">عيد مبارك</div>
  <div class="rule"><div class="rule-line"></div><div class="rule-gem-sm"></div><div class="rule-gem"></div><div class="rule-gem-sm"></div><div class="rule-line"></div></div>
  <div class="eid-word"><span>Eid</span></div>
  <div class="mubarak-word">Mubarak</div>
  <div class="rule" style="animation-delay:2.2s"><div class="rule-line"></div><div class="rule-gem-sm"></div><div class="rule-gem"></div><div class="rule-gem-sm"></div><div class="rule-line"></div></div>
  <p class="sub-msg">May joy, peace, and blessings<br>grace your home this Eid</p>
  <div class="from-block">
    <div class="orn-row"><span>✦</span><span style="font-size:7px">✦</span><span>✦</span></div>
    <div class="from-label">With warm regards from</div>
    <div class="from-name">Raiyan Tasrif &amp; Co&#8209;CRs</div>
    <div class="from-batch">Marketing Batch 30</div>
    <div class="orn-row"><span>✦</span><span style="font-size:7px">✦</span><span>✦</span></div>
  </div>
  <button class="share-btn" onclick="shareIt()">✦ &nbsp;Share the Blessing</button>
</div>
<script>
const sl = document.getElementById('starsLayer');
for (let i = 0; i < 60; i++) {
  const d = document.createElement('div'); d.className = 'dot';
  const sz = Math.random()*2.5+1;
  d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--dp:${2+Math.random()*4}s;--dd:${Math.random()*6}s`;
  sl.appendChild(d);
}
const pc = document.getElementById('petals');
const syms = ['✦','✧','◇','⋆','✺','❋'];
for (let i = 0; i < 14; i++) {
  const p = document.createElement('div'); p.className = 'petal';
  const dx = (Math.random()-0.5)*80;
  p.style.cssText = `left:${5+Math.random()*90}%;--ps:${9+Math.random()*10}px;--pd:${10+Math.random()*14}s;--pdd:${Math.random()*12}s;--px:${dx}px`;
  p.textContent = syms[Math.floor(Math.random()*syms.length)];
  pc.appendChild(p);
}

const canvas = document.getElementById('moonCanvas');
const ctx = canvas.getContext('2d');
const W = Math.min(window.innerWidth, 500);
const moonR = W * 0.22;
const cx = W/2, cy = moonR + 30;
canvas.width = W; canvas.height = cy + moonR + 20;
canvas.style.width = W+'px'; canvas.style.height = canvas.height+'px';

let t = 0, startTime = null, phase = 'hold_full';
const HOLD = 1.2, MORPH = 2.8;

function ease(x) { return x<0.5?2*x*x:1-Math.pow(-2*x+2,2)/2; }

function drawMoon(t) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const haloR = moonR+18+(1-t)*14;
  const h = ctx.createRadialGradient(cx,cy,moonR*0.6,cx,cy,haloR);
  h.addColorStop(0,`rgba(200,169,110,${0.12*(1-t*0.5)})`);
  h.addColorStop(1,'rgba(200,169,110,0)');
  ctx.beginPath(); ctx.arc(cx,cy,haloR,0,Math.PI*2); ctx.fillStyle=h; ctx.fill();

  const mg = ctx.createRadialGradient(cx-moonR*0.15,cy-moonR*0.1,moonR*0.1,cx,cy,moonR);
  mg.addColorStop(0,'#ffffff'); mg.addColorStop(0.4,'#f8f4ea'); mg.addColorStop(0.8,'#f0e8d0'); mg.addColorStop(1,'#e8d8b0');
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,moonR,0,Math.PI*2); ctx.clip();
  ctx.fillStyle=mg; ctx.fillRect(cx-moonR-2,cy-moonR-2,(moonR+2)*2,(moonR+2)*2);
  const ca = (1-t)*0.08;
  if(ca>0.005){
    [[cx-moonR*0.3,cy+moonR*0.15,moonR*0.10],[cx+moonR*0.2,cy-moonR*0.25,moonR*0.07],[cx-moonR*0.05,cy+moonR*0.38,moonR*0.06],[cx+moonR*0.35,cy+moonR*0.3,moonR*0.05]].forEach(([x,y,r])=>{
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=`rgba(180,150,90,${ca})`; ctx.fill();
    });
  }
  ctx.restore();

  ctx.save(); ctx.globalCompositeOperation='destination-out';
  ctx.beginPath(); ctx.arc(cx+moonR*1.3*t,cy,moonR*(0.98+t*0.08),0,Math.PI*2);
  ctx.fillStyle='rgba(0,0,0,1)'; ctx.fill(); ctx.restore();

  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,moonR,0,Math.PI*2);
  ctx.strokeStyle=`rgba(200,169,110,${0.3+t*0.1})`; ctx.lineWidth=0.8; ctx.stroke(); ctx.restore();

  if(t>0.5){
    const sa=(t-0.5)*2;
    drawStar(cx+moonR*0.78,cy-moonR*0.55,6,2.2,sa);
  }
}

function drawStar(x,y,ou,ir,a){
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#c8a96e'; ctx.beginPath();
  for(let i=0;i<8;i++){
    const ang=(i*Math.PI/4)-Math.PI/2, r=i%2===0?ou:ir;
    const px=x+Math.cos(ang)*r, py=y+Math.sin(ang)*r;
    i===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function animate(ts){
  if(!startTime) startTime=ts;
  const el=(ts-startTime)/1000;
  if(phase==='hold_full'){ t=0; if(el>HOLD){ phase='morphing'; startTime=ts; } }
  else if(phase==='morphing'){ const raw=Math.min(el/MORPH,1); t=ease(raw); if(raw>=1) phase='done'; }
  else t=1;
  drawMoon(t);
  if(phase!=='done') requestAnimationFrame(animate);
  else requestAnimationFrame(animateDone);
}
let beat=0;
function animateDone(ts){ beat+=0.04; ctx.clearRect(0,0,canvas.width,canvas.height); drawMoon(1);
  const p=0.7+0.3*Math.sin(beat); drawStar(cx+moonR*0.78,cy-moonR*0.55,6*p,2.2*p,1); requestAnimationFrame(animateDone);
}
setTimeout(()=>requestAnimationFrame(animate),400);

function shareIt(){
  const msg='عيد مبارك — Eid Mubarak!\n\nMay joy & blessings fill your home this Eid.\n\n— Raiyan Tasrif & Co-CRs, Marketing Batch 30';
  if(navigator.share) navigator.share({title:'Eid Mubarak',text:msg,url:window.location.href}).catch(()=>{});
  else navigator.clipboard.writeText(msg+'\n'+window.location.href).then(()=>alert('Copied! Share it 🌙')).catch(()=>alert(msg));
}
</script>
</body>
</html>
